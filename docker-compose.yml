#      SHARED_STORAGE_PATH: /shared/epsilon
#      WORKER_NAME: AIAgentWorker
#      WORKER_CONCURRENCY: 1
#      OPENAI_API_KEY: ${OPENAI_API_KEY}
#      PYTHONPATH: /app:/app/workers/ai_agent
#      JOB_FETCH_MODE: polling
