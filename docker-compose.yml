#    volumes:
#      - shared_storage:/shared/epsilon
#      - ../sdk-epsilon/archetypes:/app/sdk-epsilon/archetypes:ro
#    networks:
#      - epsilon-network
#    restart: unless-stopped

  # Execute Worker - Database polling with configurable enclave mode
  executor-worker:
    build:
      context: .
      dockerfile: workers/executor/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SHARED_STORAGE_PATH: /shared/epsilon
      WORKER_NAME: ExecuteWorker
      WORKER_CONCURRENCY: 1
      JOB_FETCH_MODE: polling
      POLLING_INTERVAL: ${POLLING_INTERVAL:-5}
      # AWS Configuration
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_KMS_KEY_ARN: ${AWS_KMS_KEY_ARN}
      AWS_KMS_KEY_ID: ${AWS_KMS_KEY_ARN}
      AWS_REGION: ${KMS_REGION:-ap-southeast-2}
      KMS_REGION: ${KMS_REGION:-ap-southeast-2}
      S3_BUCKET: ${S3_BUCKET:-epsilon-datasets}
      # Middleware endpoint for data fetching
      # Use host.docker.internal to access host machine from inside Docker
      MIDDLEWARE_ENDPOINT_URL: ${MIDDLEWARE_ENDPOINT_URL:-http://host.docker.internal:8001}
      # Enclave Mode: Set to 'true' for local simulation, 'false' for real Nitro Enclaves
      USE_LOCAL_ENCLAVE: ${USE_LOCAL_ENCLAVE:-true}
    volumes:
      - shared_storage:/shared/epsilon
      # Mount Nitro CLI for production enclave mode
      - /usr/bin/nitro-cli:/usr/bin/nitro-cli:ro
      - /var/run/nitro_enclaves:/var/run/nitro_enclaves
    networks:
      - epsilon-network
    restart: unless-stopped

  # Job Fetcher Worker - Database polling only
  job-fetcher-worker:
    build:
      context: .
      dockerfile: workers/job_fetcher/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POLLING_INTERVAL: ${POLLING_INTERVAL:-5}
      WORKER_NAME: JobFetcherWorker
      JOB_FETCH_MODE: polling
    networks:
      - epsilon-network
    restart: unless-stopped

volumes:
  shared_storage:
    name: epsilon-shared-storage
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SHARED_STORAGE_HOST_PATH:-./shared_storage}

networks:
  epsilon-network:
    name: epsilon-network
    driver: bridge