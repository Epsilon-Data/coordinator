version: '3.8'

services:
  # Clone Worker - Database polling only
  clone-worker:
    build:
      context: .
      dockerfile: workers/clone/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SHARED_STORAGE_PATH: /shared/epsilon
      WORKER_NAME: CloneWorker
      WORKER_CONCURRENCY: 2
      JOB_FETCH_MODE: polling
      POLLING_INTERVAL: ${POLLING_INTERVAL:-5}
      AI_AGENT_ENABLED: ${AI_AGENT_ENABLED}
    volumes:
      - shared_storage:/shared/epsilon
    networks:
      - epsilon-network
    restart: unless-stopped

#  # AI Agent Worker with CrewAI - Database polling only
#  ai-agent-worker:
