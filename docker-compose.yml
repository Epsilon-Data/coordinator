  # Executor Worker - Database polling with local enclave mode (cloned → completed/failed)
  executor-worker:
    build:
      context: .
      dockerfile: workers/executor/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SHARED_STORAGE_PATH: /shared/epsilon
      WORKER_NAME: ExecutorWorker
      WORKER_CONCURRENCY: 1
      JOB_FETCH_MODE: polling
      POLLING_INTERVAL: ${POLLING_INTERVAL:-5}
      # AWS Configuration
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_KMS_KEY_ARN: ${AWS_KMS_KEY_ARN}
      AWS_REGION: ${KMS_REGION:-ap-southeast-2}
      KMS_REGION: ${KMS_REGION:-ap-southeast-2}
      S3_BUCKET: ${S3_BUCKET:-epsilon-datasets}
      # Middleware endpoint for data fetching
      MIDDLEWARE_ENDPOINT_URL: ${MIDDLEWARE_ENDPOINT_URL:-http://host.docker.internal:8001}
      MIDDLEWARE_TIMEOUT_SECONDS: ${MIDDLEWARE_TIMEOUT_SECONDS:-60}
      # Enclave Mode: 'true' for local simulation, 'false' for real Nitro Enclaves
      USE_LOCAL_ENCLAVE: ${USE_LOCAL_ENCLAVE:-true}
    volumes:
      - shared_storage:/shared/epsilon
    networks:
      - epsilon-network
    restart: unless-stopped
    depends_on:
      clone-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from shared.db import db; db.engine.connect()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  shared_storage:
    name: epsilon-shared-storage
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SHARED_STORAGE_HOST_PATH:-./shared_storage}

networks:
  epsilon-network:
    name: epsilon-network
    driver: bridge