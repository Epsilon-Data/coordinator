# =============================================================================
# Epsilon Coordinator - Production Docker Compose
# Single image, multiple services architecture
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Job Fetcher Worker - Polls for pending jobs (pending → queued)
  # ---------------------------------------------------------------------------
  job-fetcher:
    image: ghcr.io/epsilon-data/coordinator:${VERSION:-latest}
    environment:
      WORKER_MODE: fetcher
      DATABASE_URL: ${DATABASE_URL}
      POLLING_INTERVAL: ${POLLING_INTERVAL:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - epsilon-network
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Clone Worker - Clones repositories (queued → cloned)
  # ---------------------------------------------------------------------------
  clone-worker:
    image: ghcr.io/epsilon-data/coordinator:${VERSION:-latest}
    environment:
      WORKER_MODE: clone
      DATABASE_URL: ${DATABASE_URL}
      SHARED_STORAGE_PATH: /shared/epsilon
      POLLING_INTERVAL: ${POLLING_INTERVAL:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - shared_storage:/shared/epsilon
    networks:
      - epsilon-network
    restart: unless-stopped
    depends_on:
      - job-fetcher
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Executor Worker - Executes in TEE (cloned/ai_approved → success/failed)
  # ---------------------------------------------------------------------------
  executor-worker:
    image: ghcr.io/epsilon-data/coordinator:${VERSION:-latest}
    environment:
      WORKER_MODE: executor
      DATABASE_URL: ${DATABASE_URL}
      SHARED_STORAGE_PATH: /shared/epsilon
      POLLING_INTERVAL: ${POLLING_INTERVAL:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # AWS Configuration
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      # Middleware
      MIDDLEWARE_ENDPOINT_URL: ${MIDDLEWARE_ENDPOINT_URL}
      MIDDLEWARE_TIMEOUT_SECONDS: ${MIDDLEWARE_TIMEOUT_SECONDS:-60}
      MIDDLEWARE_MODE: aws
      # Enclave
      USE_LOCAL_ENCLAVE: ${USE_LOCAL_ENCLAVE:-false}
      ENCLAVE_VSOCK_PORT: ${ENCLAVE_VSOCK_PORT:-5005}
    volumes:
      - shared_storage:/shared/epsilon
    networks:
      - epsilon-network
    restart: unless-stopped
    depends_on:
      - clone-worker
    deploy:
      replicas: ${EXECUTOR_REPLICAS:-1}
      resources:
        limits:
          memory: 1G
          cpus: '1'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # AI Agent Worker (Optional) - AI validation (cloned → ai_approved/ai_rejected)
  # Uncomment to enable AI validation step
  # ---------------------------------------------------------------------------
  # ai-agent-worker:
  #   image: ${DOCKER_REGISTRY:-ghcr.io/Epsilon-Data}/epsilon-coordinator:${VERSION:-latest}
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   environment:
  #     WORKER_MODE: ai
  #     DATABASE_URL: ${DATABASE_URL}
  #     SHARED_STORAGE_PATH: /shared/epsilon
  #     OPENAI_API_KEY: ${OPENAI_API_KEY}
  #     POLLING_INTERVAL: ${POLLING_INTERVAL:-5}
  #     LOG_LEVEL: ${LOG_LEVEL:-INFO}
  #   volumes:
  #     - shared_storage:/shared/epsilon
  #   networks:
  #     - epsilon-network
  #   restart: unless-stopped
  #   depends_on:
  #     - clone-worker
  #   deploy:
  #     replicas: 1
  #     resources:
  #       limits:
  #         memory: 2G
  #         cpus: '1'

# =============================================================================
# Volumes
# =============================================================================
volumes:
  shared_storage:
    name: epsilon-shared-storage
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SHARED_STORAGE_HOST_PATH:-./shared_storage}

# =============================================================================
# Networks
# =============================================================================
networks:
  epsilon-network:
    name: epsilon-network
    driver: bridge