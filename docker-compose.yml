version: '3.8'

services:
  # Job Fetcher Worker - Database polling only (pending → queued)
  job-fetcher-worker:
    build:
      context: .
      dockerfile: workers/job_fetcher/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POLLING_INTERVAL: ${POLLING_INTERVAL:-5}
      WORKER_NAME: JobFetcherWorker
      JOB_FETCH_MODE: polling
    networks:
      - epsilon-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from shared.db import db; db.engine.connect()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Clone Worker - Database polling only (queued → cloned)
  clone-worker:
    build:
      context: .
      dockerfile: workers/clone/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SHARED_STORAGE_PATH: /shared/epsilon
      WORKER_NAME: CloneWorker
      WORKER_CONCURRENCY: 2
      JOB_FETCH_MODE: polling
      POLLING_INTERVAL: ${POLLING_INTERVAL:-5}
      AI_AGENT_ENABLED: ${AI_AGENT_ENABLED:-false}
    volumes:
      - shared_storage:/shared/epsilon
    networks:
      - epsilon-network
    restart: unless-stopped
    depends_on:
      job-fetcher-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from shared.db import db; db.engine.connect()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

