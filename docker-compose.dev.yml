version: '3.8'

# =============================================================================
# Epsilon Coordinator - Development Docker Compose
# Builds locally instead of pulling from registry
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Job Fetcher Worker
  # ---------------------------------------------------------------------------
  job-fetcher:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      WORKER_MODE: fetcher
      DATABASE_URL: ${DATABASE_URL}
      POLLING_INTERVAL: 3
      LOG_LEVEL: DEBUG
    networks:
      - epsilon-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Clone Worker
  # ---------------------------------------------------------------------------
  clone-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      WORKER_MODE: clone
      DATABASE_URL: ${DATABASE_URL}
      SHARED_STORAGE_PATH: /shared/epsilon
      POLLING_INTERVAL: 3
      LOG_LEVEL: DEBUG
    volumes:
      - ./shared_storage:/shared/epsilon
    networks:
      - epsilon-network
    depends_on:
      - job-fetcher

  # ---------------------------------------------------------------------------
  # Executor Worker (Local Enclave Mode)
  # ---------------------------------------------------------------------------
  executor-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      WORKER_MODE: executor
      DATABASE_URL: ${DATABASE_URL}
      SHARED_STORAGE_PATH: /shared/epsilon
      POLLING_INTERVAL: 3
      LOG_LEVEL: INFO
      ENVIRONMENT: development
      # AWS Configuration
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      # Local development settings
      MIDDLEWARE_ENDPOINT_URL: http://host.docker.internal:8001
      USE_LOCAL_ENCLAVE: "true"
    volumes:
      - ./shared_storage:/shared/epsilon
    networks:
      - epsilon-network
    depends_on:
      - clone-worker

networks:
  epsilon-network:
    name: epsilon-network-dev
    driver: bridge