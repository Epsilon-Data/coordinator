[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epsilon-coordinator"
version = "1.0.2"
description = "Job processing system with secure enclave execution"
requires-python = ">=3.9"

# Core dependencies (all workers need these)
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9.6",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
# Clone worker - no extra deps
clone = []

# Job fetcher - no extra deps
job-fetcher = []

# Executor worker
executor = [
    "boto3>=1.26.0",
    "cryptography>=41.0.0",
    "pydantic>=2.4.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
]

# AI Agent worker
ai-agent = [
    "crewai==1.11.0",
    "crewai-tools==1.11.0",
    "langchain==1.2.12",
    "langchain-community==0.4.1",
    "langchain-openai==1.1.11",
    "openai==2.29.0",
    "pydantic>=2.4.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

# Production workers (without AI agent)
all = [
    "epsilon-coordinator[executor]",
]

# All workers including AI agent (heavy dependencies)
all-with-ai = [
    "epsilon-coordinator[executor]",
    "epsilon-coordinator[ai-agent]",
]

# Development and testing
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "freezegun>=1.2.0",
    "responses>=0.24.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
    "boto3-stubs[kms]>=1.26.0",
    "commitizen>=3.0.0",
    "pre-commit>=3.0.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "workers*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]
