name: CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # Test: Runs on PRs
  # ==========================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev,executor,ai-agent]"

      - name: Run tests
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/testdb"
        run: pytest --tb=short -q
