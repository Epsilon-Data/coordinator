name: Bug Report
description: Report a bug in Epsilon Coordinator
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Configure worker with...
        2. Submit a job...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output (redact any secrets).
      render: shell
  - type: dropdown
    id: worker
    attributes:
      label: Worker Type
      options:
        - Job Fetcher
        - Clone Worker
        - Executor Worker
        - AI Agent Worker
        - Other
  - type: input
    id: version
    attributes:
      label: Version
      description: Docker image tag or git commit SHA.
